const lessons = [
  {
    title: "Introduction to Image-to-Video",
    tag: "Overview",
    subtitle: "What I2V is, why it's hard, and how modern systems solve it.",
    body: `
      <h3>What is Image-to-Video Generation?</h3>
      <p>Image-to-Video (I2V) is the task of generating a temporally coherent video clip from a single still image, optionally guided by a text prompt. Given one frame, the model must invent plausible motion — camera dynamics, object movement, lighting changes — while remaining faithful to the input image.</p>
      <div class="callout"><strong>Intuition:</strong> hand the model a photograph of a waterfall and ask it to bring it to life. It must decide how the water flows, how mist drifts, how light scatters over time — all inferred from one static frame.</div>
      <h3>Why is it Difficult?</h3>
      <ul>
        <li><strong>Temporal consistency</strong> — objects must remain coherent across frames. A face cannot subtly shift shape between frame 5 and frame 6.</li>
        <li><strong>Causal structure</strong> — the model must understand that frame N depends only on frames 0 through N−1, not frames yet to come.</li>
        <li><strong>Scale</strong> — a 4-second 24fps video is 96 frames. Processing them jointly in pixel space is computationally infeasible without compression.</li>
        <li><strong>Conditioning fidelity</strong> — the generated video must look like the input image, not just be vaguely similar to it.</li>
      </ul>
      <h3>The Modern Recipe</h3>
      <p>State-of-the-art I2V models (WAN, CogVideoX, Open-Sora) all converge on the same architectural pattern:</p>
      <div class="concept-row">
        <div class="concept-card"><div class="concept-card-title">Video VAE</div><div class="concept-card-body">Compress video from pixels into a compact 3D latent space. Makes diffusion ~64× cheaper to run.</div></div>
        <div class="concept-card"><div class="concept-card-title">Diffusion Transformer</div><div class="concept-card-body">A transformer that denoises latent video, attending across space and time simultaneously.</div></div>
        <div class="concept-card"><div class="concept-card-title">Flow Matching</div><div class="concept-card-body">Training objective that learns straight-line paths from noise to data. Faster and simpler than DDPM.</div></div>
        <div class="concept-card"><div class="concept-card-title">Conditioning</div><div class="concept-card-body">The input image and text are encoded and injected via cross-attention at every denoising step.</div></div>
      </div>
      <h3>What This Series Builds</h3>
      <p>We implement each component from scratch in PyTorch. By the end you will have a structurally faithful I2V pipeline:</p>
      <div class="diagram">
        <span class="d-box">Image + Text</span><span class="d-arr">→</span><span class="d-box">VAE Encode</span><span class="d-arr">→</span><span class="d-box">Noisy Latent</span><span class="d-arr">→</span><span class="d-box">DiT Denoise</span><span class="d-arr">→</span><span class="d-box">VAE Decode</span><span class="d-arr">→</span><span class="d-box">Video</span>
      </div>
      <p>If you have worked with LLMs or basic diffusion models before, many ideas here will feel familiar. Let's begin.</p>
    `

  {
    title: "Causal 3D Convolutions",
    tag: "VAE",
    subtitle: "CausalConv3d",
    body: `


    <p>
      To start with, we’ll first understand one of the core building blocks used in modern video generation architectures: <strong>CausalConv3d</strong>.
      If you remember, in Transformers we use a <strong>causal attention mask</strong> so that token <code>t</code> can only see previous tokens and never future ones.
      Video generation follows the exact same principle, except instead of generating words over time, we generate frames:
    </p>

    <pre>frame₀ → frame₁ → frame₂ → ...</pre>

    <p>
      This is conceptually similar to autoregressive text generation:
    </p>

    <pre>word₀ → word₁ → word₂ → ...</pre>

    <h3>Why Do We Need Causal Conv3D?</h3>

    <p>
      In video models, tensors are usually represented as:
    </p>

    <pre>(T × H × W)</pre>

    <p>
      where <code>T</code> is time (frames), <code>H</code> is height, and <code>W</code> is width.
      For example:
    </p>

    <pre>Video Shape = 8 × 32 × 32</pre>

    <p>
      means 8 frames of resolution 32×32.
      Now suppose we apply a normal <code>Conv3D</code> with kernel size:
    </p>

    <pre>3 × 3 × 3</pre>

    <p>
      A standard Conv3D is <strong>not causal</strong>.
      While processing frame <code>t</code>, the convolution may look at:
    </p>

    <pre>[t-1, t, t+1]</pre>

    <div class="callout">
      <strong>Problem:</strong>
      During autoregressive generation, frame <code>t+1</code> belongs to the future.
      The model should never access future frames while generating the current one.
    </div>

    <h3>Causal Conv3D</h3>

    <p>
      CausalConv3D fixes this by restricting the temporal receptive field to only past and present frames:
    </p>

    <pre>[t-2, t-1, t]</pre>

    <p>
      This preserves temporal causality and makes the convolution compatible with autoregressive video generation.
    </p>

    <h3>Temporal Padding</h3>

    <p>
      At the beginning of the sequence (<code>t = 0</code>), there are no previous frames available.
      To solve this, we pad the temporal dimension on the left side:
    </p>

    <pre>[pad, pad, t0, t1, t2, ...]</pre>

    <p>
      So when the convolution operates on the first frame, it effectively sees:
    </p>

    <pre>[pad, pad, t0]</pre>

    <div class="callout">
      <strong>Key Idea:</strong>
      Temporal padding is applied only on the LEFT side so future frames are never exposed to the convolution kernel.
    </div>

    <h2>PyTorch Implementation</h2>

    <p>
      The key ideas behind the implementation are:
    </p>

    <ul>
      <li>Left-only temporal padding</li>
      <li>Symmetric spatial padding</li>
      <li>Support for dilation</li>
    </ul>

    <span class="code-label">vae/conv.py</span>

    <pre><span class="c-kw">import</span> torch
<span class="c-kw">import</span> torch.nn <span class="c-kw">as</span> nn
<span class="c-kw">import</span> torch.nn.functional <span class="c-kw">as</span> F


<span class="c-kw">class</span> <span class="c-fn">CausalConv3d</span>(nn.Module):
    <span class="c-str">"""
    Conv3d that is causal in the time dimension.
    Spatial dims (H, W) use standard symmetric padding.
    Time dim uses left-only padding so the kernel never sees future frames.
    """</span>

    <span class="c-kw">def</span> <span class="c-fn">__init__</span>(
        self,
        in_channels: int,
        out_channels: int,
        kernel_size: int | tuple,
        stride: int | tuple = <span class="c-num">1</span>,
        dilation: int | tuple = <span class="c-num">1</span>,
        bias: bool = <span class="c-kw">True</span>,
    ):
        <span class="c-fn">super</span>().__init__()

        <span class="c-cm"># Normalize to tuples: (T, H, W)</span>
        <span class="c-kw">if</span> isinstance(kernel_size, int):
            kernel_size = (kernel_size, kernel_size, kernel_size)

        <span class="c-kw">if</span> isinstance(stride, int):
            stride = (stride, stride, stride)

        <span class="c-kw">if</span> isinstance(dilation, int):
            dilation = (dilation, dilation, dilation)

        self.kernel_size = kernel_size
        self.stride = stride
        self.dilation = dilation

        kt, kh, kw = kernel_size
        dt, dh, dw = dilation

        <span class="c-cm"># Temporal causal padding</span>
        self.time_pad = (kt - <span class="c-num">1</span>) * dt

        <span class="c-cm"># Symmetric spatial padding</span>
        pad_h = (kh - <span class="c-num">1</span>) * dh // <span class="c-num">2</span>
        pad_w = (kw - <span class="c-num">1</span>) * dw // <span class="c-num">2</span>

        self.conv = nn.<span class="c-fn">Conv3d</span>(
            in_channels,
            out_channels,
            kernel_size=kernel_size,
            stride=stride,
            dilation=dilation,
            padding=(<span class="c-num">0</span>, pad_h, pad_w),
            bias=bias,
        )

    <span class="c-kw">def</span> <span class="c-fn">forward</span>(self, x: torch.Tensor) -> torch.Tensor:
        <span class="c-cm"># x: (B, C, T, H, W)</span>

        <span class="c-kw">if</span> self.time_pad > <span class="c-num">0</span>:
            x = F.<span class="c-fn">pad</span>(
                x,
                (<span class="c-num">0</span>, <span class="c-num">0</span>,
                 <span class="c-num">0</span>, <span class="c-num">0</span>,
                 self.time_pad, <span class="c-num">0</span>)
            )

        <span class="c-kw">return</span> self.<span class="c-fn">conv</span>(x)


<span class="c-kw">class</span> <span class="c-fn">CausalConv3d_1x1</span>(nn.Module):
    <span class="c-str">"""Pointwise (1×1×1) conv."""</span>

      <h3>The Problem with DDPM</h3>
      <p>Denoising Diffusion Probabilistic Models add noise via a fixed Markov chain and learn to reverse it. They work well, but training requires carefully tuned noise schedules and inference requires hundreds of denoising steps.</p>
      <h3>Flow Matching</h3>
      <p>Flow matching learns a <strong>vector field</strong> that moves samples from noise to data. The simplest version uses <em>straight-line paths</em>: the flow from noise <code>x₀ ~ N(0,I)</code> to data <code>x₁</code> is the straight line between them.</p>
      <div class="callout"><strong>Rectified Flow:</strong> at any t ∈ [0,1], the interpolated sample is <em>xₜ = (1−t)·x₀ + t·x₁</em>. The target velocity is the constant <em>v = x₁ − x₀</em>. The model learns to predict this velocity — much simpler than DDPM's time-varying noise prediction.</div>
      <h3>Training</h3>
      <span class="code-label">flow_matching.py</span>
      <pre><span class="c-kw">def</span> <span class="c-fn">flow_matching_loss</span>(model, x1, cond):
    B  = x1.shape[<span class="c-num">0</span>]
    t  = torch.<span class="c-fn">rand</span>(B, device=x1.device)
    x0 = torch.<span class="c-fn">randn_like</span>(x1)
    t_ = t[:,<span class="c-kw">None</span>,<span class="c-kw">None</span>,<span class="c-kw">None</span>,<span class="c-kw">None</span>]
    xt = (<span class="c-num">1</span> - t_) * x0 + t_ * x1   <span class="c-cm"># interpolate</span>
    v_pred   = <span class="c-fn">model</span>(xt, t, cond)
    v_target = x1 - x0               <span class="c-cm"># straight-line velocity</span>
    <span class="c-kw">return</span> F.<span class="c-fn">mse_loss</span>(v_pred, v_target)</pre>
      <h3>Inference: Euler Integration</h3>
      <p>Start from pure noise and integrate the learned velocity forward:</p>
      <pre>x = torch.<span class="c-fn">randn</span>(B, C, T, H, W)
<span class="c-kw">for</span> t <span class="c-kw">in</span> torch.<span class="c-fn">linspace</span>(<span class="c-num">0</span>, <span class="c-num">1</span>, steps=<span class="c-num">20</span>):
    v = <span class="c-fn">model</span>(x, t, cond)
    x = x + v / steps</pre>
      <p>Because paths are straight lines, good samples emerge in as few as 10–20 steps — far fewer than DDPM's typical 1000. This is why WAN, CogVideoX, and most recent video models have adopted flow matching.</p>
      <div class="concept-row">
        <div class="concept-card"><div class="concept-card-title">DDPM</div><div class="concept-card-body">Learns curved denoising paths. Requires ~1000 steps at inference. Sensitive to noise schedule choice.</div></div>
        <div class="concept-card"><div class="concept-card-title">Flow Matching</div><div class="concept-card-body">Learns straight-line paths. 10–20 inference steps. Simple MSE training objective. Scales well to video.</div></div>
      </div>
    `
  },
  {
    title: "Text & Image Conditioning",
    tag: "Conditioning",
    subtitle: "Encoding what we want the video to look like and injecting it at every denoising step.",
    body: `
      <h3>Two Conditioning Signals</h3>
      <p>An I2V model is guided by two sources: a <strong>reference image</strong> (the first frame, which the video must start from) and an optional <strong>text prompt</strong> (describing desired motion or scene). Each must be encoded into a form the DiT can consume via cross-attention.</p>
      <h3>Text Encoding</h3>
      <p>Text is encoded with a frozen T5 or CLIP text encoder. The encoder outputs one dense embedding per token. These become the <em>keys and values</em> in the cross-attention layers:</p>
      <span class="code-label">encoders.py</span>
      <pre><span class="c-kw">from</span> transformers <span class="c-kw">import</span> T5EncoderModel, T5Tokenizer

tokenizer = T5Tokenizer.<span class="c-fn">from_pretrained</span>(<span class="c-str">"t5-base"</span>)
encoder   = T5EncoderModel.<span class="c-fn">from_pretrained</span>(<span class="c-str">"t5-base"</span>)

<span class="c-kw">def</span> <span class="c-fn">encode_text</span>(prompt):
    tokens = <span class="c-fn">tokenizer</span>(prompt, return_tensors=<span class="c-str">"pt"</span>, padding=<span class="c-kw">True</span>)
    <span class="c-kw">with</span> torch.no_grad():
        out = <span class="c-fn">encoder</span>(**tokens)
    <span class="c-kw">return</span> out.last_hidden_state  <span class="c-cm"># (B, seq_len, d)</span></pre>
      <h3>Image Conditioning — The I2V Key Ingredient</h3>
      <p>Two complementary strategies are used together in most production I2V models:</p>
      <div class="concept-row">
        <div class="concept-card"><div class="concept-card-title">Latent Concatenation</div><div class="concept-card-body">Encode the reference image with the VAE encoder. Concatenate it with the noisy video latent along the channel dimension. The DiT sees both at every step, preserving pixel-level fidelity.</div></div>
        <div class="concept-card"><div class="concept-card-title">CLIP Image Embedding</div><div class="concept-card-body">Encode the image with CLIP's visual encoder for semantic representation. Added to the text tokens as additional cross-attention context.</div></div>
      </div>
      <h3>Classifier-Free Guidance</h3>
      <p>To strengthen conditioning, we train with <strong>CFG</strong>: with ~15% probability, drop all conditioning and train unconditionally. At inference, combine both predictions:</p>
      <pre>v_guided = v_uncond + scale * (v_cond - v_uncond)</pre>
      <p>Scale 1.0 is unconditional; 7.0 is strongly conditional. This lets you dial adherence to the image and text without retraining.</p>
      <div class="callout"><strong>Key insight:</strong> CFG doesn't need a separate classifier. The same model produces both conditional and unconditional predictions by simply nullifying the conditioning tokens during the unconditional forward pass.</div>
    `
  },
  {
    title: "The Training Pipeline",
    tag: "Training",
    subtitle: "Connecting all components and training the full I2V system end-to-end.",
    body: `
      <h3>Everything Together</h3>
      <p>We now have every component. Training connects them in sequence: encode video to latents, sample a timestep and noise, run the DiT, compute the flow matching loss, and update weights.</p>
      <div class="diagram">
        <div><span class="d-box">Video batch</span><span class="d-arr">→</span><span class="d-box">VAE.encode()</span><span class="d-arr">→</span><span class="d-box">Latents z₁</span></div>
        <div><span class="d-box">Interpolate → zₜ</span><span class="d-arr">→</span><span class="d-box">DiT(zₜ, t, cond)</span><span class="d-arr">→</span><span class="d-box">v_pred</span><span class="d-arr">→</span><span class="d-box">FM Loss</span></div>
      </div>
      <span class="code-label">train.py</span>
      <pre><span class="c-kw">for</span> batch <span class="c-kw">in</span> dataloader:
    video, image, text = batch

    <span class="c-kw">with</span> torch.no_grad():
        z1   = vae.<span class="c-fn">encode</span>(video)           <span class="c-cm"># frozen VAE</span>
        cond = <span class="c-fn">encode_conditions</span>(image, text)

    loss = <span class="c-fn">flow_matching_loss</span>(dit, z1, cond)

    optimizer.<span class="c-fn">zero_grad</span>()
    loss.<span class="c-fn">backward</span>()
    optimizer.<span class="c-fn">step</span>()
    ema.<span class="c-fn">update</span>(dit)</pre>
      <h3>Practical Considerations</h3>
      <div class="concept-row">
        <div class="concept-card"><div class="concept-card-title">Gradient Checkpointing</div><div class="concept-card-body">Recompute activations during backward pass instead of storing them. Trades compute for memory — essential for video.</div></div>
        <div class="concept-card"><div class="concept-card-title">Mixed Precision (bf16)</div><div class="concept-card-body">Train in bfloat16 with fp32 master weights. Halves memory with negligible loss on modern GPUs.</div></div>
        <div class="concept-card"><div class="concept-card-title">EMA Weights</div><div class="concept-card-body">Maintain an exponential moving average of weights. The EMA model is used for sampling — more stable and higher quality.</div></div>
        <div class="concept-card"><div class="concept-card-title">Frame Dropout</div><div class="concept-card-body">Randomly vary the number of training frames per batch. Teaches the model to handle variable-length video at inference time.</div></div>
      </div>
      <h3>What Comes Next</h3>
      <p>This completes the NanoI2V series. You now understand every component of a modern I2V pipeline — from causal 3D convolutions to the full training loop. Logical next steps:</p>
      <ul>
        <li>Scale up: larger DiT, more data, longer video.</li>
        <li>Add video-specific losses: temporal perceptual loss, optical flow consistency.</li>
        <li>Read the WAN, CogVideoX, and Open-Sora papers to see how production systems extend these ideas.</li>
      </ul>
      <div class="callout"><strong>Thank you for following along.</strong> If this series was useful, a ⭐ on GitHub helps it reach more builders and researchers.</div>
    `
  }
];

let current = 0;

function buildTopicList() {
  const el = document.getElementById('topic-list-items');
  lessons.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'topic-item';
    row.onclick = () => showLesson(i);
    row.innerHTML = `
      <span class="ti-num">${String(i+1).padStart(2,'0')}</span>
      <span class="ti-title">${l.title}</span>
      <span class="ti-tag">${l.tag}</span>
    `;
    el.appendChild(row);
  });
}

function showHome() {
  document.getElementById('home-view').classList.add('active');
  document.getElementById('lesson-view').classList.remove('active');
  document.getElementById('nav-progress').textContent = '';
  window.scrollTo(0, 0);
}

function showLesson(i) {
  current = i;
  const l = lessons[i];

  document.getElementById('l-num').textContent = `${String(i+1).padStart(2,'0')} / ${lessons.length}`;
  document.getElementById('l-tag').textContent = l.tag;
  document.getElementById('l-title').textContent = l.title;
  document.getElementById('l-subtitle').textContent = l.subtitle;
  document.getElementById('l-body').innerHTML = l.body;
  document.getElementById('nav-progress').textContent = `${i+1} of ${lessons.length}`;

  const btnP = document.getElementById('btn-prev');
  const btnN = document.getElementById('btn-next');
  btnP.disabled = i === 0;
  btnN.disabled = i === lessons.length - 1;
  document.getElementById('prev-title').textContent = i > 0 ? lessons[i-1].title : '';
  document.getElementById('next-title').textContent = i < lessons.length-1 ? lessons[i+1].title : '';

  document.getElementById('home-view').classList.remove('active');
  const lv = document.getElementById('lesson-view');
  lv.classList.add('active');

  const wrap = lv.querySelector('.lesson-wrap');
  wrap.classList.remove('fade-in');
  void wrap.offsetWidth;
  wrap.classList.add('fade-in');
  window.scrollTo(0, 0);
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < lessons.length) showLesson(next);
}

buildTopicList();
</script>
