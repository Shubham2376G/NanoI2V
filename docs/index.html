    subtitle: "",
    body: `
      <h2>What is Image-to-Video Generation?</h2>
      <p>Image-to-Video (I2V) as the name suggests its a model that converts a image into a video which is optionally guided by a text prompt. Given the Image (frame 1 on that video), the model must invent plausible motion such camera dynamics, object movement, lighting changes, while remaining faithful to the input image.</p>

    <div class="hero-image">
    <img 
        src="images/i2v.png" 
        alt="Image-to-video generation pipeline showing a single image transformed into multiple video frames"
    />
    <p class="caption">
        A single input image is expanded into a temporally consistent sequence of video frames.
    </p>
    </div>



      <div class="callout"><strong>Intuition:</strong> Given a photograph of a waterfall and ask it to bring it to life. It must decide how the water flows, how mist drifts, how light scatters; all inferred from one static frame.</div>

      <h3>What makes it Difficult</h3>
      <ul>
        <li><strong>Temporal consistency</strong>: objects must remain coherent across frames. A face cannot subtly shift shape between frame 5 and frame 6.</li>
        <li><strong>Causal structure</strong>: the model must understand that frame N depends only on frames 0 through N−1, not frames yet to come.</li>
        <li><strong>Scale</strong>: a 4-second 24fps video is 96 frames. Processing them jointly in pixel space is computationally infeasible without compression.</li>
        <li><strong>Conditioning fidelity</strong>: the generated video must look like the input image, not just be vaguely similar to it.</li>
      </ul>

<h2>The Modern Recipe</h2>

<p>
  Modern Image-to-Video models like WAN, CogVideoX, and Open-Sora mostly follow the same high-level design:
</p>

    title: "Causal 3D Convolutions",
    tag: "VAE",
    subtitle: "CausalConv3d: Prevents future frame leakage",
    body: `
      <p>One of the core building blocks of modern video generation architectures is <strong>CausalConv3d</strong>. If you remember, In Transformers we use a causal attention mask so that token <code>t</code> can only see previous tokens. Video generation follows the exact same principle except instead of generating words, we generate frames:</p>

      <samp class="nota">frame₀ → frame₁ → frame₂ → ...</samp>

      <p>Conceptually identical to autoregressive text generation:</p>

      <samp class="nota">word₀ → word₁ → word₂ → ...</samp>

      <h2>Why Do We Need Causal Conv3D?</h2>
      <p>In video models, we usually work with tensors shaped like: <code>(T × H × W)</code> - time, height, width (I am ignoring the channel dimension here for simplicity).</p><p> For example, <code>8 × 32 × 32</code> means 8 frames of 32×32 resolution. A standard <code>Conv3D</code> with kernel <code>3 × 3 × 3</code> is <em>not causal</em>, so while processing frame <code>t</code>, the convolution may look at <code>[t-1, t, t+1]</code>.</p>

        <span class="c-kw">if</span> isinstance(stride, int):

            kernel_size=kernel_size,
            stride=stride,
            dilation=dilation,
            padding=(<span class="c-num">0</span>, pad_h, pad_w),
            bias=bias,
        )

    <span class="c-kw">def</span> <span class="c-fn">forward</span>(self, x: torch.Tensor) -> torch.Tensor:
        <span class="c-cm"># x: (B, C, T, H, W)</span>

        <span class="c-kw">return</span> self.<span class="c-fn">conv</span>(x)

      <h2>What's Dilation?</h2>

      <div class="concept-row">

        <div class="concept-card"><div class="concept-card-title">Large dilation</div><div class="concept-card-body">Captures longer-range temporal dependencies across distant frames.</div></div>

      <h2>Why the Padding Formula?</h2>

pad_w    = (kw - 1) * dw // 2   <span class="c-cm"># symmetric, keeps W dimension</span>
time_pad = (kt - 1) * dt        <span class="c-cm"># left-only, causal</span></pre>

      <h3>Spatial vs. Temporal Padding</h3>
      <table>
        <thead><tr><th>Dimension</th><th>Padding</th><th>Reason</th></tr></thead>
        <tbody>
          <tr><td>Time</td><td>Left-only</td><td>Future frames must never be visible</td></tr>
          <tr><td>Height</td><td>Symmetric</td><td>No notion of "future" pixels spatially</td></tr>
          <tr><td>Width</td><td>Symmetric</td><td>No notion of "future" pixels spatially</td></tr>
        </tbody>
      </table>

      <h2>Key Takeaways</h2>

        <li>CausalConv3D prevents future frame leakage, analogous to causal attention in Transformers</li>
        <li>Temporal padding is applied left-only; spatial padding is symmetric</li>
        <li>Dilation expands the receptive field without adding parameters</li>
        <li>Correct padding preserves output dimensions through deep networks</li>

<h2>First, What is an Autoencoder?</h2>

<p>

<p>

</p>

<pre>    <span class="c-kw">def</span> <span class="c-fn">sample</span>(
        self,

        logvar: torch.Tensor,

        std    = torch.exp(<span class="c-num">0.5</span> * logvar)

        <span class="c-kw">return</span> mean + std * eps</pre>

<p>
  The naive way to sample from <code>N(μ, σ²)</code> is:
</p>

<pre>z = torch.normal(mean, std)</pre>

<p>
  But this is not differentiable. Backprop cannot flow through a random sampling operation.
</p>

<p>
  The reparameterization trick solves this by separating the randomness from the parameters:
</p>

<pre>
ε ~ N(0, I)       ← pure noise, no parameters
z = μ + σ × ε    ← gradients flow through μ and σ cleanly
</pre>

<p>
  The randomness is now in <code>ε</code> which has no parameters, so gradients can flow freely through <code>mean</code> and <code>std</code>.
</p>

<p>
  One more thing, we clamp <code>logvar</code> to <code>[-10, 10]</code>:
</p>

<pre>logvar = logvar.clamp(-10.0, 10.0)</pre>

<p>
  because <code>exp(logvar)</code> blows up to infinity if <code>logvar</code> is large.
  Without this clamp, one bad batch can NaN your whole training run.
</p>

<pre>    <span class="c-kw">def</span> <span class="c-fn">kl_loss</span>(
        self,
        mean: torch.Tensor,
        logvar: torch.Tensor,

        logvar = logvar.clamp(<span class="c-num">-10.0</span>, <span class="c-num">10.0</span>)
        kl = <span class="c-num">-0.5</span> * (<span class="c-num">1.0</span> + logvar - mean.pow(<span class="c-num">2</span>) - logvar.exp())

<p>
  The KL loss measures how far the encoder's distribution <code>q(z|x)</code> is from the prior <code>p(z) = N(0, I)</code>.
</p>

<p>
  The formula for KL between two Gaussians is:
</p>

<pre>

<p>
  Breaking it down intuitively:
</p>

<ul>
  <li><code>mean²</code> : penalizes the mean for drifting away from 0</li>
  <li><code>exp(logvar)</code> : penalizes variance for being too large</li>
  <li><code>logvar</code> : rewards variance for not collapsing to 0 (the model shouldn't become deterministic)</li>
  <li><code>1</code> : normalization constant from the closed-form derivation</li>
</ul>

<p>
  Together this pushes the encoder to produce distributions that stay close to:
  <pre>N(0, I)</pre>

<pre><span class="c-kw">class</span> <span class="c-fn">VAE3D</span>(nn.Module):

<p>

      <p>
        You may have heard about things like <strong>DDPM</strong>,
        <strong>score matching</strong>, or <strong>flow matching</strong>.
        They are all different generative paradigms.
      </p>

      <p>
        Here we will only focus on <strong>flow matching</strong>.
      </p>
      <h2>The Main Idea</h2>

<p>
  In image or video generation, our task is simple:
</p>
<p>
  Move points from a simple distribution (Gaussian noise) to a complex distribution (real videos).
</p>
 
$$P_{\text{initial}} \;\longrightarrow\; P_{\text{target}}$$
$$\mathcal{N}(0, I) \;\longrightarrow\; \text{distribution of real videos}$$
 
<p>
  We want to find a path that moves every point (noisy-random video) in the noise distribution
  to a corresponding point (real video) in the target distribution.
</p>
 
<div class="callout">
  <strong>Note:</strong> By point I mean some video in a high dimensional space with some distribution, not pixel
</div>

<div class="hero-image">
    <img 
        src="images/fm.png" 
        alt="Flow Matching"
    />
    <p class="caption">
        Flow Matching
    </p>
    </div>


 
<h2>Notation</h2>
 
<p>
  We parameterize this movement using time $t$:
</p>
 
<pre>t = 0  →  pure noise (where we start)
t = 1  →  clean data (where we want to end up)</pre>
 
<p>
  Let $x_t$ be the position of a point as it travels from noise to data.
</p>
 
<p>
  Then $p_t(x)$ is the probability distribution of all those points at time $t$ and $u_t(x)$ is the <strong>velocity field</strong>: the direction and speed
  each point is moving at time $t$.
</p>
 
<p>
  For a single point:
</p>
 
$$\frac{dx}{dt} = u_t(x)$$
 
 
 
<h2>What Are We Actually Learning?</h2>
 
<p>
  Our goal is to learn a parameterized velocity field $u_\theta(x_t, t)$
  such that integrating it from $t=0$ to $t=1$ moves noise to data:
</p>
 
$$x_1 = x_0 + \int_0^1 u_\theta(x_t,\, t)\, dt$$
 
<p>
  So we want to make our predicted velocity match the true velocity at every point.
</p>
 
$$\mathcal{L}_{\text{FM}} = \mathbb{E}_{t,\, x_t} \left[ \left\| u_\theta(x_t, t) - u_t(x_t) \right\|^2 \right]$$
 
 
<h2>The Problem: We Do Not Know the True Velocity</h2>
 
<p>
  We do not have access to $u_t(x)$.
  We do not know the target distribution explicitly, we only have samples from it (our training videos) i.e just some points from the distribution.
</p>
 
<p>
  So we cannot compute this loss directly, thus we introduce Conditional Flow Matching (CFM).
</p>
 
 
 
<h2>Conditional Flow Matching</h2>
 
<p>
  Instead of trying to match the full velocity,
  we condition on a single target point $x_1$ from the training data.
</p>
 
<p>
  Given a specific $x_1$, we define a simple straight-line path from noise to that point:
</p>
 
$$x_t = (1 - t) \cdot x_0 \;+\; t \cdot x_1, \qquad x_0 \sim \mathcal{N}(0, I)$$
 
<p>
At $t=0$ you have pure noise. At $t=1$ you have the clean sample.
</p>
 
<p>
  The velocity along this path is the time derivative:
</p>
 
$$\frac{dx_t}{dt} = \frac{d}{dt}\bigl[(1-t)\cdot x_0 + t \cdot x_1\bigr] = -x_0 + x_1 = x_1 - x_0$$
 


<p>
  We can also write this in an equivalent form.
  At time $t$, your position is $x_t$.
  So:
</p>
 
$$u_t(x_t \mid x_1) = \frac{x_1 - x_t}{1 - t}$$
 
<p>
  Both forms are identical. You can verify by substituting
  $x_t = (1-t)\cdot x_0 + t \cdot x_1$ into the second form and simplifying.
</p>
 

<p>
  Now the conditional flow matching loss becomes:
</p>
 
$$\mathcal{L}_{\text{CFM}} = \mathbb{E}_{t,\, x_1,\, x_0} \left[ \left\| u_\theta(x_t, t) - u_t(x_t \mid x_1) \right\|^2 \right]$$
 
<p>
  where $x_t = (1-t)\cdot x_0 + t \cdot x_1$
</p>
 

<h2>Why Does This Work?</h2>

<p>
  You might ask: we require the loss
  $ \mathcal{L}_{\mathrm{FM}} $,
  so how can we instead train using the conditional loss
  $ \mathcal{L}_{\mathrm{CFM}} $?
  Are we solving a different problem?
</p>

<p>
  No. This is the central theorem behind flow matching.
</p>

<p>
  Start with the original flow matching objective:
</p>

$$
\mathcal{L}_{\mathrm{FM}}
=
\mathbb{E}\left[
\left\|u_\theta(x_t,t)-u_t(x_t)\right\|^2
\right]
$$

<p>
  Expanding the square gives:
</p>

$$
\mathcal{L}_{\mathrm{FM}}
=
\mathbb{E}\left[\|u_\theta\|^2\right]
-
2\,\mathbb{E}\left[
\langle u_\theta,u_t\rangle
\right]
+
\underbrace{
\mathbb{E}\left[\|u_t\|^2\right]
}_{\text{constant w.r.t. }\theta}
$$

<p>
  The final term does not depend on the network parameters
  $ \theta $,
  so minimizing
  $ \mathcal{L}_{\mathrm{FM}} $
  is equivalent to minimizing:
</p>

$$
\mathbb{E}\left[\|u_\theta\|^2\right]
-
2\,\mathbb{E}\left[
\langle u_\theta,u_t\rangle
\right]
$$

<p>
  Now consider the conditional flow matching objective:
</p>

$$
\mathcal{L}_{\mathrm{CFM}}
=
\mathbb{E}\left[
\left\|
u_\theta(x_t,t)
-
u_t(x_t\mid x_1)
\right\|^2
\right]
$$

<p>
  For straight-line interpolation,
</p>

$$
u_t(x_t\mid x_1)=x_1-x_0
$$

<p>
  so:
</p>

$$
\mathcal{L}_{\mathrm{CFM}}
=
\mathbb{E}\left[
\left\|
u_\theta-(x_1-x_0)
\right\|^2
\right]
$$

<p>
  Expanding again:
</p>

$$
\mathcal{L}_{\mathrm{CFM}}
=
\mathbb{E}\left[\|u_\theta\|^2\right]
-
2\,\mathbb{E}\left[
\langle u_\theta,(x_1-x_0)\rangle
\right]
+
\underbrace{
\mathbb{E}\left[\|x_1-x_0\|^2\right]
}_{\text{constant w.r.t. }\theta}
$$

<p>
  Again, the final term is constant with respect to
  $ \theta $.
  Therefore minimizing
  $ \mathcal{L}_{\mathrm{CFM}} $
  is equivalent to minimizing:
</p>

$$
\mathbb{E}\left[\|u_\theta\|^2\right]
-
2\,\mathbb{E}\left[
\langle u_\theta,(x_1-x_0)\rangle
\right]
$$

<p>
  Therefore, the two objectives are equivalent if the cross terms are equal:
</p>

$$
\mathbb{E}\left[
\langle u_\theta,u_t\rangle
\right]
=
\mathbb{E}\left[
\langle u_\theta,u_t(x_t\mid x_1)\rangle
\right]
$$

<p>
  To prove this, write the first expectation as an integral over the marginal density
  $ p_t(x) $:
</p>

$$
\mathbb{E}\left[
\langle u_\theta,u_t\rangle
\right]
=
\int_0^1
\int
\langle u_\theta(x,t),u_t(x)\rangle
\,p_t(x)\,dx\,dt
$$

<p>
  Using the law of total expectation,
</p>

$$
f(x)
=
\int
f(x\mid z)\,p(z\mid x)\,dz
$$

<p>
  we obtain
</p>

$$
u_t(x)
=
\int
u_t(x\mid x_1)\,
p(x_1\mid x,t)\,dx_1
$$


<p>
  Substituting this into the integral:
</p>

$$
=
\int_t
\int_x
\left\langle
u_\theta(x,t),
\int
u_t(x\mid x_1)
p(x_1\mid x,t)\,dx_1
\right\rangle
p_t(x)\,dx\,dt
$$

<p>
  By linearity, move the inner integral outside:
</p>

$$
=
\int_t
\int_x
\int_{x_1}
\langle
u_\theta(x,t),
u_t(x\mid x_1)
\rangle
\,p(x_1\mid x,t)\,
p_t(x)
\,dx_1\,dx\,dt
$$

<p>
  Now apply Bayes' rule:
</p>

$$
p(x_1\mid x,t)\,p_t(x)
=
p_t(x\mid x_1)\,p_{\mathrm{data}}(x_1)
$$

<p>
  Substituting:
</p>

$$
=
\int_t
\int_x
\int_{x_1}

<p>
  But this is exactly the expectation:
</p>

$$
=
\mathbb{E}\left[
\langle
u_\theta(x_t,t),
u_t(x_t\mid x_1)
\rangle
\right]
$$

<p>
  Therefore:
</p>

$$
\boxed{
\mathbb{E}\left[
\langle u_\theta,u_t\rangle
\right]
=
\mathbb{E}\left[
\langle
u_\theta,
u_t(x_t\mid x_1)
\rangle
\right]
}
$$

<p>
  This proves that
  $ \mathcal{L}_{\mathrm{FM}} $
  and
  $ \mathcal{L}_{\mathrm{CFM}} $
  differ only by constants independent of
  $ \theta $,
  so both objectives have the same minimizer.
</p>

 
<div class="callout">
  <strong>Conclusion:</strong> $\mathcal{L}_{\text{FM}}$ and $\mathcal{L}_{\text{CFM}}$ have
  identical gradients with respect to $\theta$.
  Minimizing the conditional loss is exactly the same optimization problem as minimizing the marginal loss.
  We replaced an intractable loss with a tractable one, and nothing changed mathematically.
</div>
 
<p>
  This is why flow matching is powerful.
  We never need to know the full target distribution.
  We just need training samples from it.
</p>
 
 
<h2>Timestep Sampling</h2>

<p>
  During training we sample a random timestep $t$ for each batch.
  The naive choice is uniform:
</p>

$$t \sim \text{Uniform}(0, 1)$$

<p>
  But this treats all timesteps as equally important. They are not.
</p>


<p>
  Near $t=0$, $x_t$ is almost clean data.
  The model does not need to learn very much here because the input is already close to the answer.
  So the gradient signal is less informative.
</p>

<p>
  Near $t=1$, $x_t$ is almost pure noise.
  There is very little structure left to recover, so again the gradient signal is not very useful.
</p>

<p>
  Near $t=0.5$, the model is doing the hardest work.
  It sees a mix of signal and noise, so it has to figure out which parts are real and which parts are corruption.
  This is where the most useful gradient signal lives.
</p>

<p>
  So we use <strong>logit-normal sampling</strong> to concentrate training on these hard timesteps:
</p>

$$u \sim \mathcal{N}(\mu,\, \sigma^2), \qquad t = \text{sigmoid}(u)$$

<p>
  Since $\text{sigmoid}(0) = 0.5$, and we use $\mu = 0$,
  this puts more probability mass near $t = 0.5$.
</p>


<p>
  The idea is simple: we still train on all timesteps, but we do more gradient updates where the model actually learns the most useful direction.
</p>

<h2>Training Direction vs Inference Direction</h2>

<p>
  In our implementation, the convention is:
</p>

<pre>t = 0  →  clean data
t = 1  →  pure noise</pre>

<p>
  So during training, the interpolation adds more noise as $t$ increases:
</p>

$$x_t = (1 - t) \cdot x_0 + t \cdot \varepsilon, \qquad \varepsilon \sim \mathcal{N}(0, I)$$

<p>
  and the target velocity points from data toward noise:
</p>

$$v^* = \varepsilon - x_0$$

<p>
  During <strong>inference</strong>, we run it backwards.
  We start from $t=1$ (pure noise) and walk toward $t=0$ (clean data).
</p>

<pre>Training:  t: 0 → 1,  x_0 is clean data,  x_t gets noisier as t increases
Inference: t: 1 → 0,  start from pure noise,  subtract velocity to reach clean data</pre>

<p>
  The velocity $v^* = \varepsilon - x_0$ points toward noise.
  At inference we go against that direction:
</p>

$$x_{t - dt} = x_t \;-\; dt \cdot v_\theta(x_t, t)$$

<div class="callout">
  <strong>Note on conventions:</strong> The original flow matching paper (Lipman et al. 2022)

<h2>Classifier-Free Guidance (CFG)</h2>

<p>
  <strong>During inference:</strong> run the model twice at each step:
  once with conditioning, once with the null embedding, and then combine the two predictions:
</p>

$$v_{\text{guided}} = v_{\text{uncond}} \;+\; s \cdot (v_{\text{cond}} - v_{\text{uncond}})$$

<p>
  where $s$ is the guidance scale. Breaking this down:
</p>
 
<pre>v_uncond              →  base velocity, without conditioning
(v_cond - v_uncond)   →  the direction pushed by conditioning
s                     →  how strongly we follow that direction</pre>
 
<p>
  A guidance scale of $s = 1$ means we follow the conditioning normally.
  Higher values like 7, 9, or 12 push the output more strongly toward the prompt,
  at the cost of some diversity.
</p>
 
<div class="callout">
  <strong>Note:</strong> We train the model in unconditional mode too, so we can measure how the conditioning signal changes the predicted direction.
  Then during inference, CFG lets us control how strongly we want to move in that direction.
</div>
 
 
<h2>ODE Solvers: Euler vs Heun</h2>
 
<div class="hero-image">
    <img 
        src="images/Heun.png" 
        alt="Heun's method"
    />
    <p class="caption">
        Euler vs Heun's method
    </p>
    </div>


<p>
  During Inference, we solve this ODE:
</p>
 
$$\frac{dx}{dt} = v_\theta(x_t, t)$$
 
<p>
  We start from pure noise $x_1 \sim \mathcal{N}(0, I)$ and integrate backward toward clean data $x_0$.
</p>



<p>
  <strong>Euler:</strong> evaluate the velocity at the current position and take a step in that direction.
</p>


 
$$x_{t - dt} = x_t \;-\; dt \cdot v_\theta(x_t, t)$$
 
<p>
  This is simple and fast because it only needs one model evaluation per step.
  But if the timestep is large, error starts accumulating.
  The reason is that the actual trajectory is curved, while Euler assumes the direction stays constant during the whole step.
</p>


<p>
  <strong>Heun (2nd order Runge-Kutta):</strong> first take a temporary Euler step,
  check what the velocity looks like there, then average both directions.
</p>

$$\tilde{x} = x_t - dt \cdot v_1, \qquad v_1 = v_\theta(x_t, t) \tag{predictor}$$

$$v_2 = v_\theta(\tilde{x},\; t - dt) \tag{corrector}$$

$$x_{t-dt} = x_t - dt \cdot \frac{v_1 + v_2}{2} \tag{averaged step}$$

<p>
  Heun needs two model evaluations per step, but gives a much more accurate trajectory.
  Euler only looks at the current direction.
  Heun also checks where that step would land, notices if the trajectory is curving,
  and corrects the step using both directions.
</p>

<div class="callout">
  <strong>Note:</strong> If the velocity field curves strongly, Euler can drift away from the true trajectory because it assumes the direction stays fixed during the step.
  Heun reduces this error by checking the velocity both before and after the step, then averaging them.
</div>
 
 
<h2>Key Takeaways</h2>
 
<ul>
  <li>
    Flow matching learns a velocity field $u_\theta(x_t, t)$ that moves points
    from noise to data along straight-line paths.
  </li>
  <li>
    The conditional loss $\mathcal{L}_{\text{CFM}}$ is mathematically equivalent to
    the intractable marginal loss $\mathcal{L}_{\text{FM}}$ because it has same gradients.
  </li>
  <li>
    The target velocity $x_1 - x_0$ is constant along the entire trajectory.
    Direction never changes, only position does.
  </li>
  <li>
    Logit-normal timestep sampling concentrates training near $t = 0.5$
    where the model does its hardest work.
  </li>
  <li>
    Training goes $t: 0 \to 1$, inference goes $t: 1 \to 0$
  </li>
  <li>
    CFG amplifies the direction conditioning pushes which is controlled by the guidance scale $s$.
  </li>
  <li>
    Euler is one model call per step; Heun is two but significantly more accurate.
  </li>
</ul>

<span class="c-kw">class</span> <span class="c-fn">FlowMatchingScheduler</span>(nn.Module):

    Implements flow matching for video latent diffusion.

            t:     (B,)              timesteps in [0, 1]

            x_t:   noisy latent at timestep t
            noise: the noise that was added (needed to compute target)
        """</span>
        <span class="c-kw">if</span> noise <span class="c-kw">is</span> <span class="c-kw">None</span>:

        Args:

    <span class="c-cm"># ── Training step ────────────────────────────────────────────────</span>

    <span class="c-kw">def</span> <span class="c-fn">training_loss</span>(
        self,

        x_0: torch.Tensor,
        c_txt: torch.Tensor,                 <span class="c-cm"># text conditioning (B, L, D)</span>
        c_img: torch.Tensor,                 <span class="c-cm"># image conditioning (B, N, D)</span>
        null_c_txt: torch.Tensor,            <span class="c-cm"># null text embedding for CFG dropout</span>

    <span class="c-kw">def</span> <span class="c-fn">@torch.no_grad()</span>

            c_img:     image conditioning

        x_t = torch.randn(shape, device=device)

        <span class="c-cm"># We use num_steps+1 points: [1.0, ..., 0.0]</span>
        timesteps = torch.linspace(<span class="c-num">1.0</span>, <span class="c-num">0.0</span>, num_steps + <span class="c-num">1</span>, device=device)

            <span class="c-cm"># 1. Conditioned</span>

    <span class="c-kw">def</span> <span class="c-fn">@torch.no_grad()</span>
    <span class="c-kw">def</span> <span class="c-fn">dpm_sample</span>(

        Heun:   x̃  = x_t - dt * v(x_t)                  1st eval

        """</span>

        dt_const  = <span class="c-num">1.0</span> / num_steps

        <span class="c-kw">for</span> i <span class="c-kw">in</span> range(num_steps):

                null_c_txt.expand_as(c_txt),
                null_c_img.expand_as(c_img),

            t_batch_next = t_next.expand(shape[<span class="c-num">0</span>])
            v_cond2   = model(x_pred, t_batch_next, c_txt, c_img)

                null_c_txt.expand_as(c_txt),
                null_c_img.expand_as(c_img),

            v2 = v_uncond2 + cfg * (v_cond2 - v_uncond2)

<pre><span class="c-kw">class</span> <span class="c-fn">TimestepSampler</span>:

<p>
  Two strategies, as discussed.
</p>

<p>
  The uniform path is straightforward, just sample $t$ uniformly between 0 and 1.
</p>

<p>
  The logit path does this in two lines:
</p>

<pre>
u = torch.randn(batch_size, device=device)   # u ~ N(0, 1)
u = self.logit_mean + self.logit_std * u     # shift and scale
return torch.sigmoid(u)                      # squash into (0, 1)
</pre>

<p>
  With <code>logit_mean=0</code> and <code>logit_std=1</code>,
  this is equivalent to sampling from a standard logit-normal:
</p>

$$u \sim \mathcal{N}(0, 1), \qquad t = \text{sigmoid}(u)$$

<p>
  Since <code>sigmoid(0) = 0.5</code>, the distribution peaks at $t = 0.5$
  and falls off toward both extremes.
</p>


<h2>FlowMatchingScheduler</h2>

<pre><span class="c-kw">class</span> <span class="c-fn">FlowMatchingScheduler</span>(nn.Module):

    <span class="c-kw">def</span> <span class="c-fn">__init__</span>(

  Now it is time to code our DiT model.
</p>
 
<p>
  But before we do that, we need one important concept that will be used inside this model.
</p>
 
<h2>Rotary Position Embedding (RoPE)</h2>
 
 
<p>
  Earlier transformers handled positions by simply adding positional embeddings directly to the token embedding:
</p>
 
$$
x_p = x + e_p
$$
 
<p>
  where:
</p>
 
<ul>
  <li><code>x</code> → token embedding</li>
  <li><code>e_p</code> → positional embedding for position <code>p</code></li>
</ul>
 
<p>
  This works, but position is injected from the outside.
  It is not built naturally into the attention mechanism itself.
</p>
 
<p>
  RoPE uses a different idea.
  Instead of adding a position vector, we rotate the embedding.
</p>
 
<div class="callout">
  <strong>RoPE idea:</strong> different positions correspond to different rotations, so position becomes encoded as phase.
</div>
 
<h2>The Main Idea</h2>
 
<p>
  RoPE treats the embedding dimension like a collection of 2D vectors.
</p>
 
<p>
  The hidden dimensions are grouped into pairs:
</p>
 
<pre>(x₁, x₂), (x₃, x₄), (x₅, x₆), ...</pre>
 
<p>
  Each pair acts like a small 2D vector.
  Then we rotate each pair by an angle that depends on the token position.
</p>
 
<p>
  So instead of attaching position information directly,
  we build it into the geometry of the embedding itself. Thus getting a position-dependent orientation.
</p>
 
<div class="hero-image">

<h2>How Rotation Is Applied</h2>
 
<p>
  For a token at position \\(p\\), each dimension pair is rotated by:
</p>
 
  $$p \\cdot \\theta_i$$
<p>
  where:
</p>
 
<ul>
  <li>\\(p\\) → token position</li>
  <li>\\(\\theta_i\\) → frequency used for pair \\(i\\)</li>
</ul>
 
<p>
  Different pairs use different frequencies.
</p>
 
<p>
  Low-frequency pairs rotate slowly.
  High-frequency pairs rotate quickly.
</p>
 
 
<h2>Why Do We Need Slow and Fast Frequencies?</h2>
 
<p>
  Rotations are periodic.
</p>
 
<p>
  If we use only one frequency, positions eventually repeat:
</p>
 
$$
(\\cos(p\\omega), \\sin(p\\omega))
$$
 
<p>
  After enough positions, different tokens can collide.
  This is called <strong>aliasing</strong>.
</p>
 
<p>
  Multiple frequencies solve this problem.
</p>
 

 
$$
\\left[e^{ip\\omega_1}, e^{ip\\omega_2}, e^{ip\\omega_3}, \\dots\\right]
$$
 
<p>
  Now position is no longer a single periodic value.
  It becomes a multi-frequency phase pattern.
</p>
 
<div class="callout">
  <strong>Important:</strong> if all frequencies were slow, nearby tokens would look almost identical.
  If all frequencies were very fast, the representation would become too unstable. Thus We need both.
</div>
 
<h2>How Attention Uses RoPE</h2>
 
<p>
  Standard attention score is:
</p>
 
$$
q_i^\\top k_j
$$
 
<p>
  After applying RoPE, we rotate both query and key:
</p>
 
$$
q_i = R(\\theta_i)\\,\\tilde{q}_i
$$
 
$$
k_j = R(\\theta_j)\\,\\tilde{k}_j
$$
 
<p>
  Then the attention score becomes:
</p>
 
$$
q_i^\\top k_j
=
\\tilde{q}_i^\\top R(\\theta_j - \\theta_i)\\tilde{k}_j
$$
 
<p>
  This is the key insight.
</p>
 
 
<p>
  The attention score no longer depends only on absolute position, but on relative postions.

</p>

<h2>Step 1: 1D RoPE Frequencies</h2>

<pre><span class="c-kw">def</span> <span class="c-fn">get_1d_freqs</span>(

<p>

  <li>video tokens have temporal positions</li>

<p>

</p>

<pre>
(t, h, w)

<p>
  video space.

<p>

<h2>Potential Questions</h2>

<h3>Q: How do we know the Query is the one being updated in attention?</h3>

<p>
Because the output contains one vector per query position,
so the output shape matches the query shape.
</p>

<p>
$$
\\mathrm{Attention}(Q,K,V)
=
\\mathrm{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V
$$
</p>

<p>
$$
Q \\in \\mathbb{R}^{n_q \\times d_k},
\\quad
K \\in \\mathbb{R}^{n_k \\times d_k},
\\quad
V \\in \\mathbb{R}^{n_k \\times d_v}
$$
</p>

<p>
$$
QK^T :
(n_q \\times d_k)(d_k \\times n_k)
=
n_q \\times n_k
$$
</p>

<p>
$$
\\mathrm{softmax}(QK^T)V :
(n_q \\times n_k)(n_k \\times d_v)
=
n_q \\times d_v
$$
</p>

<p>
The final output has \\(n_q\\) rows; one output vector for each query.
Hence attention updates queries.
</p>

<h3>Q: Does cross-attention replace self-attention?</h3>

<p>
  No.
  Most architectures use both.
</p>

<p>
  Self-attention handles internal communication within a modality.
  Cross-attention injects external conditioning information.
</p>

<h3>Q: Why not always use bidirectional attention?</h3>

<p>
  Because sometimes you want one stream to remain stable.
</p>

    nn.init.normal_(self.t_embedder.mlp[<span class="c-num">0</span>].weight, std=<span class="c-num">0.02</span>)
    nn.init.normal_(self.t_embedder.mlp[<span class="c-num">2</span>].weight, std=<span class="c-num">0.02</span>)
</pre>

<p>
  The idea here is simple:
  start with safe values, then let training shape the model gradually.
</p>

<p>
Xavier initialization is used for most linear and convolution layers, while the patch embedder and timestep MLP get a smaller normal initialization because they interact with raw latent inputs.
</p>

<p><strong>What do I mean by that?</strong></p>

<p>
Xavier initialization is designed to preserve variance across layers:
</p>

$$
\\text{Var}(Wx) \\approx \\text{Var}(x)
$$

<p>
This works well for most transformer blocks because they get already processed and normalized hidden representations.
</p>

<p>
However, the patch embedder and timestep MLP are different. They directly interact with the raw diffusion inputs i.e unprocessed
</p>

<p>
For diffusion input-facing layers, we often prefer:
</p>

$$
\\text{Var}(Wx) < \\text{Var}(x)
$$

<p>
during the early stages of training, so the model starts conservatively instead of aggressively propagating noise through the network.
</p>

<p>
That is why DiT initializes the patch embedder and timestep MLP with an even smaller normal initialization than standard Xavier initialization.
</p>

<div class="callout">
  <strong>Intuition:</strong>
  good initialization does not make the model smart,
  it makes the model trainable and converge faster.
</div>

<h2>Step 2: Patchify and Unpatchify</h2>

<p>
  The next thing we need is a way to move between video space and transformer space.
</p>

<p>
  Transformers do not naturally operate on a 3D video grid.
  They operate on token sequences.
  So we convert the video latent into tokens first,
  and then convert it back at the end.
</p>

<h3>Patchify</h3>

<p>
  <code>patchify</code> takes the video latent and splits it into non-overlapping 3D patches.
  Each patch becomes one token.
</p>

<pre><span class="c-kw">def</span> <span class="c-fn">patchify</span>(self, z: torch.Tensor) -&gt; torch.Tensor:
    <span class="c-str">"""
    Convert video latent into token sequence.

    z: (B, C_in, T', H', W')
    Returns: (B, N, hidden_dim)
        N = num_t * num_h * num_w
    """</span>
    <span class="c-cm"># Conv3d with stride=patch_size does the patchification:</span>
    <span class="c-cm"># Each (patch_t × patch_h × patch_w) block → one hidden_dim vector</span>
    x = self.patch_embed(z)      <span class="c-cm"># (B, hidden_dim, num_t, num_h, num_w)</span>

    <span class="c-cm"># Flatten spatial dims into sequence</span>
    <span class="c-cm"># (B, D, T, H, W) → (B, D, N) → (B, N, D)</span>
    B, D, T, H, W = x.shape
    x = x.flatten(<span class="c-num">2</span>).transpose(<span class="c-num">1</span>, <span class="c-num">2</span>)   <span class="c-cm"># (B, N, D)</span>
    <span class="c-kw">return</span> x
</pre>

<p>
  Here the 3D convolution is doing the patch extraction for us.
  Because the kernel size and stride are the same,
  the patches do not overlap.
</p>

<p>
  That means each token represents one local spatiotemporal chunk of the video.
</p>

<h3>Unpatchify</h3>

<p>
  <code>unpatchify</code> does the reverse.
  It takes the token sequence and rebuilds the video latent.
</p>

<pre><span class="c-kw">def</span> <span class="c-fn">unpatchify</span>(self, x: torch.Tensor) -&gt; torch.Tensor:
    <span class="c-str">"""
    Convert token sequence back into video latent.

    x: (B, N, out_patch_dim)
        out_patch_dim = latent_channels * patch_t * patch_h * patch_w
    Returns: (B, latent_channels, T', H', W')
    """</span>
    B  = x.shape[<span class="c-num">0</span>]
    pt, ph, pw = self.patch_t, self.patch_h, self.patch_w
    C  = self.latent_channels

    <span class="c-cm"># Reshape: (B, N, out_patch_dim) → (B, num_t, num_h, num_w, C, pt, ph, pw)</span>
    x = x.view(B, self.num_t, self.num_h, self.num_w, C, pt, ph, pw)

    <span class="c-cm"># Rearrange to (B, C, T', H', W'):</span>
    <span class="c-cm"># T' = num_t * pt, H' = num_h * ph, W' = num_w * pw</span>
    x = x.permute(<span class="c-num">0</span>, <span class="c-num">4</span>, <span class="c-num">1</span>, <span class="c-num">5</span>, <span class="c-num">2</span>, <span class="c-num">6</span>, <span class="c-num">3</span>, <span class="c-num">7</span>)
    <span class="c-cm"># Now: (B, C, num_t, pt, num_h, ph, num_w, pw)</span>
    x = x.contiguous().view(
        B, C,
        self.num_t * pt,
        self.num_h * ph,
        self.num_w * pw,
    )
    <span class="c-kw">return</span> x
</pre>

<div class="callout">
  <strong>Important:</strong>
  patchify turns video into tokens, and unpatchify turns tokens back into video.
  This is the bridge between transformer space and latent video space.
</div>

<h2>Step 3: Build Conditioning</h2>

<p>
  Now we need to prepare the conditioning information.
</p>

<p>
  DiT uses two different conditioning paths:
</p>

<ul>
  <li><strong>c</strong> → a pooled conditioning vector for adaLN</li>
  <li><strong>cond_tokens</strong> → a token sequence for cross-attention</li>
</ul>


<h3>Pooled conditioning for adaLN</h3>


<pre>
t_emb + txt_pool + img_pool = c
</pre>

<p>
  This vector becomes the conditioning signal used by adaLN inside every DiT block.
</p>

<h3>Token conditioning for cross-attention</h3>

<p>
  For cross-attention, we keep the token sequence.
  The text tokens stay as they are.
  The image tokens are projected into the same dimension as text tokens,
  and then both are concatenated.
</p>

<pre>
cond_tokens = [txt_tokens, img_tokens_proj]
</pre>

<p>
  This gives the transformer a richer conditioning stream.
</p>

<pre><span class="c-kw">def</span> <span class="c-fn">build_conditioning</span>(
    self,
    t: torch.Tensor,           <span class="c-cm"># (B,)</span>
    txt_tokens: torch.Tensor,  <span class="c-cm"># (B, L, text_dim)</span>
    img_tokens: torch.Tensor,  <span class="c-cm"># (B, M, clip_dim)</span>
) -&gt; tuple[torch.Tensor, torch.Tensor]:
    <span class="c-str">"""
    Build:
        c           — pooled signal for adaLN  (B, cond_dim)
        cond_tokens — sequence for cross-attn  (B, L+M, text_dim)
    """</span>
    <span class="c-cm"># ── Pooled adaLN signal ───────────────────────────────────────</span>
    t_emb     = self.t_embedder(t)                          <span class="c-cm"># (B, cond_dim)</span>

    txt_pool  = txt_tokens.mean(dim=<span class="c-num">1</span>)                      <span class="c-cm"># (B, text_dim)</span>
    txt_pool  = self.txt_pool_proj(txt_pool)                <span class="c-cm"># (B, cond_dim)</span>

    img_pool  = img_tokens[:, <span class="c-num">0</span>]                            <span class="c-cm"># (B, clip_dim) ← CLS token</span>
    img_pool  = self.img_pool_proj(img_pool)                <span class="c-cm"># (B, cond_dim)</span>

    <span class="c-cm"># Sum all three signals — each contributes to adaLN modulation</span>
    c = t_emb + txt_pool + img_pool                         <span class="c-cm"># (B, cond_dim)</span>

    <span class="c-cm"># ── Cross-attention token sequence ───────────────────────────</span>
    <span class="c-cm"># Project CLIP tokens → text_dim so they can be concatenated</span>
    img_tokens_proj = self.img_token_proj(img_tokens)       <span class="c-cm"># (B, M, text_dim)</span>

    <span class="c-cm"># Concatenate: text tokens first, then image tokens</span>
    cond_tokens = torch.cat([txt_tokens, img_tokens_proj], dim=<span class="c-num">1</span>)  <span class="c-cm"># (B, L+M, text_dim)</span>

    <span class="c-kw">return</span> c, cond_tokens
</pre>

<p>here if you see that, we did something slightly crazy.</p>

<p>
we took:
</p>

<pre>txt_tokens.shape = (B, L, text_dim)</pre>

<p>
and then did:
</p>

<pre>txt_pool = txt_tokens.mean(dim=1)</pre>

<p>
Did we just collapse the entire text representation into a single vector? Wouldn't that destroy all the information?
</p>

<p>
Yes, this does destroy some information, but not all of it.
</p>

<p>
after mean pooling, the model no longer knows:
</p>

<ul>
<li>exact token ordering</li>
<li>fine-grained token interactions</li>
</ul>

<p>
so why is this okay?
</p>

<p>
because this pooled vector is <b>not the main conditioning path</b>.
</p>

<p>
this vector:
</p>

<pre>c = t_emb + txt_pool + img_pool</pre>

<p>
is only used for:
</p>

<ul>
<li>adaLN modulation</li>
<li>global conditioning</li>
<li>scale/shift/gating signals inside transformer blocks</li>
</ul>

<p>
for this purpose, the model only needs a rough global semantic summary like:
</p>

<ul>
<li>"this is a dog image"</li>
<li>"this prompt is about a sunset"</li>
<li>"this timestep is noisy"</li>
</ul>

<p>
the detailed information is still preserved here:
</p>

<pre>
cond_tokens = torch.cat(
    [txt_tokens, img_tokens_proj],
    dim=1
)
</pre>

<p>
those full token sequences are later consumed by cross-attention.
</p>

<p>
so the architecture effectively has two conditioning paths:
</p>

<ul>
<li><code>c</code> → global modulation signal</li>
<li><code>cond_tokens</code> → detailed token-level conditioning</li>
</ul>

<p>
this is why mean pooling works surprisingly well here.
it gives the transformer a compact "global understanding" while cross-attention still preserves all fine-grained information.
</p>


<h2>Step 4: The Forward Pass</h2>


<h3>4.1 I2V conditioning</h3>

<p>
  The image latent is tiled across time so it can act as a stable reference
  at every video frame.
</p>

<pre>
z_img → repeated across time → matched with z_t
</pre>

<p>
  Then we concatenate the noisy video latent and the tiled image latent
  on the channel axis.
</p>

<pre>
z_in = concat(z_t, z_img)
</pre>

<h3>4.2 Patchify</h3>

<p>
  The combined latent is patchified into tokens.
</p>

<pre>
x = self.patchify(z_in)
</pre>

<h3>4.3 Build conditioning</h3>

<p>
  We create the pooled conditioning vector and the cross-attention tokens.
</p>

<pre>
c, cond_tokens = self.build_conditioning(t, txt_tokens, img_tokens)
</pre>

<h3>4.4 Create 3D position ids</h3>

<p>
  Since the tokens come from time, height, and width,
  we create 3D position ids for RoPE.
</p>

<pre>
pos_ids = make_3d_pos_ids(...)
</pre>

<h3>4.5 Pass through DiT blocks</h3>

<p>
  The token sequence is then refined layer by layer.
</p>

<pre>
for block in self.blocks:
    x = block(x, c, cond_tokens, pos_ids)
</pre>

<p>
  Each block applies:
</p>

<ol>
  <li>self-attention</li>
  <li>cross-attention</li>
  <li>feed-forward network</li>
</ol>

<p>
  And each of those sub-blocks is modulated by adaLN.
  So the timestep and conditioning keep influencing the model at every stage.
</p>

<h3>4.6 Final layer and unpatchify</h3>

<p>
  After all the blocks finish refining the tokens,
  the final layer projects them back into patch space.
</p>

<pre>
x = self.final_layer(x, c)
v = self.unpatchify(x)
</pre>

<p>
  The result is the predicted velocity field in video latent space.
</p>

<pre><span class="c-kw">def</span> <span class="c-fn">forward</span>(
    self,
    z_t: torch.Tensor,         <span class="c-cm"># (B, C, T', H', W')  noisy video latent</span>
    t: torch.Tensor,           <span class="c-cm"># (B,)                timesteps in [0,1]</span>
    txt_tokens: torch.Tensor,  <span class="c-cm"># (B, L, text_dim)    T5 sequence</span>
    img_tokens: torch.Tensor,  <span class="c-cm"># (B, M, clip_dim)    CLIP tokens</span>
    z_img: torch.Tensor,       <span class="c-cm"># (B, C, T', H', W')  image latent (I2V)</span>
) -&gt; torch.Tensor:
    <span class="c-str">"""
    Predict velocity field for flow matching.

    Returns:
        v_pred: (B, C, T', H', W')  predicted velocity
    """</span>
    B = z_t.shape[<span class="c-num">0</span>]
    device = z_t.device

    <span class="c-cm"># ── Step 1: I2V conditioning ──────────────────────────────────</span>
    <span class="c-cm"># Tile image latent across time to match z_t shape</span>
    <span class="c-cm"># z_img is the VAE-encoded first frame, shape (B, C, 1, H', W')</span>
    <span class="c-cm"># or already tiled (B, C, T', H', W') — handle both</span>
    <span class="c-kw">if</span> z_img.shape[<span class="c-num">2</span>] == <span class="c-num">1</span>:
        z_img = z_img.expand_as(z_t)       <span class="c-cm"># tile across T'</span>

    <span class="c-cm"># Concatenate on channel dim: (B, 2C, T', H', W')</span>
    z_in = torch.cat([z_t, z_img], dim=<span class="c-num">1</span>)

    <span class="c-cm"># ── Step 2: Patchify ─────────────────────────────────────────</span>
    x = self.patchify(z_in)                <span class="c-cm"># (B, N, hidden_dim)</span>

    <span class="c-cm"># ── Step 3: Build conditioning ───────────────────────────────</span>
    c, cond_tokens = self.build_conditioning(t, txt_tokens, img_tokens)
    <span class="c-cm"># c:           (B, cond_dim)</span>
    <span class="c-cm"># cond_tokens: (B, L+M, text_dim)</span>

    <span class="c-cm"># ── Step 4: 3D position ids for RoPE ─────────────────────────</span>
    pos_ids = make_3d_pos_ids(
        self.num_t, self.num_h, self.num_w, device=device
    ).expand(B, -<span class="c-num">1</span>, -<span class="c-num">1</span>)                    <span class="c-cm"># (B, N, 3)</span>

    <span class="c-cm"># ── Step 5: DiT blocks ────────────────────────────────────────</span>
    <span class="c-kw">for</span> block <span class="c-kw">in</span> self.blocks:
        x = block(x, c, cond_tokens, pos_ids)

    <span class="c-cm"># ── Step 6: Final layer → unpatchify ─────────────────────────</span>
    x = self.final_layer(x, c)             <span class="c-cm"># (B, N, out_patch_dim)</span>
    v = self.unpatchify(x)                 <span class="c-cm"># (B, C, T', H', W')</span>

    <span class="c-kw">return</span> v
</pre>



<h2>Step 5: Null Conditioning for CFG</h2>

<p>
  The model also keeps learned null embeddings.
  These are used for classifier-free guidance.
</p>

<p>
  During training, sometimes the conditioning is dropped.
  In that case, the model uses these null tokens instead.
</p>

<pre><span class="c-kw">def</span> <span class="c-fn">get_null_conditioning</span>(
    self, B: int, L: int, M: int, device: torch.device
) -&gt; tuple[torch.Tensor, torch.Tensor]:

    """</span>

    null_img = self.null_img_token.expand(B, M, <span class="c-kw">-1</span>)   <span class="c-cm"># (B, M, clip_dim)</span>
    <span class="c-kw">return</span> null_txt.to(device), null_img.to(device)
</pre>

<h2>What the model is predicting</h2>

<p>
  This model predicts the <strong>velocity field</strong> used in flow matching.
</p>

<p>
  No, It does not directly output the final clean video.
  It predicts the direction the noisy latent should move in.
</p>

<pre>
noisy latent → predicted velocity → denoised latent
</pre>

<p>
  This makes the generation process smoother and more stable.
</p>


<h2>Full Flow of the Model</h2>

</p>



<h2>Why this design works</h2>

</ul>

<div class="callout">

  VideoDiT is a clean pipeline that takes noisy video, adds conditioning,

    row.onclick = () => showLesson(i);
    row.innerHTML = `
      <span class="ti-num">${String(i+1).padStart(2,'0')}</span>
      <span class="ti-title">${l.title}</span>
      <span class="ti-tag">${l.tag}</span>
    `;
    el.appendChild(row);
  });
}

function showHome() {
  history.replaceState(null, null, ' ');
  document.getElementById('home-view').classList.add('active');
  document.getElementById('lesson-view').classList.remove('active');
  document.getElementById('nav-progress').textContent = '';
  window.scrollTo(0, 0);
}

function showLesson(i, updateHash = true) {
  current = i;
  const l = lessons[i];

  if (updateHash) {
    updateURL(i);
    }
  document.getElementById('l-num').textContent = `${String(i+1).padStart(2,'0')} / ${lessons.length}`;
  document.getElementById('l-tag').textContent = l.tag;
  document.getElementById('l-title').textContent = l.title;
  document.getElementById('l-subtitle').textContent = l.subtitle;
  document.getElementById('l-body').innerHTML = l.body;

  renderMath(); // FIX

  document.getElementById('nav-progress').textContent = `${i+1} of ${lessons.length}`;

  const btnP = document.getElementById('btn-prev');
  const btnN = document.getElementById('btn-next');
  btnP.disabled = i === 0;
  btnN.disabled = i === lessons.length - 1;
  document.getElementById('prev-title').textContent = i > 0 ? lessons[i-1].title : '';
  document.getElementById('next-title').textContent = i < lessons.length - 1 ? lessons[i+1].title : '';

  document.getElementById('home-view').classList.remove('active');
  const lv = document.getElementById('lesson-view');
  lv.classList.add('active');

  const wrap = lv.querySelector('.lesson-wrap');
  wrap.classList.remove('fade-in');
  void wrap.offsetWidth;
  wrap.classList.add('fade-in');
  window.scrollTo(0, 0);
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < lessons.length) showLesson(next);
}

buildTopicList();
loadFromURL();
</script>
</body>
</html>
