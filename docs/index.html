    body: `
      <h2>What is Image-to-Video Generation?</h2>
      <p>Image-to-Video (I2V) as the name suggests its a model that converts a image into a video which is optionally guided by a text prompt. Given the Image (frame 1 on that video), the model must invent plausible motion such camera dynamics, object movement, lighting changes, while remaining faithful to the input image.</p>

    <div class="hero-image">
    <img

      <div class="callout"><strong>Intuition:</strong> Given a photograph of a waterfall and ask it to bring it to life. It must decide how the water flows, how mist drifts, how light scatters; all inferred from one static frame.</div>

      <h3>What makes it Difficult</h3>
      <ul>
        <li><strong>Temporal consistency</strong>: objects must remain coherent across frames. A face cannot subtly shift shape between frame 5 and frame 6.</li>
        <li><strong>Causal structure</strong>: the model must understand that frame N depends only on frames 0 through N−1, not frames yet to come.</li>
        <li><strong>Scale</strong>: a 4-second 24fps video is 96 frames. Processing them jointly in pixel space is computationally infeasible without compression.</li>
        <li><strong>Conditioning fidelity</strong>: the generated video must look like the input image, not just be vaguely similar to it.</li>
      </ul>

<h2>The Modern Recipe</h2>

<p>

</p>

    subtitle: "CausalConv3d: Prevents future frame leakage",
    body: `
      <p>One of the core building blocks of modern video generation architectures is <strong>CausalConv3d</strong>. If you remember, In Transformers we use a causal attention mask so that token <code>t</code> can only see previous tokens. Video generation follows the exact same principle except instead of generating words, we generate frames:</p>

      <samp class="nota">frame₀ → frame₁ → frame₂ → ...</samp>

      <p>Conceptually identical to autoregressive text generation:</p>

      <samp class="nota">word₀ → word₁ → word₂ → ...</samp>

      <h2>Why Do We Need Causal Conv3D?</h2>
      <p>In video models, we usually work with tensors shaped like: <code>(T × H × W)</code> - time, height, width (I am ignoring the channel dimension here for simplicity).</p><p> For example, <code>8 × 32 × 32</code> means 8 frames of 32×32 resolution. A standard <code>Conv3D</code> with kernel <code>3 × 3 × 3</code> is <em>not causal</em>, so while processing frame <code>t</code>, the convolution may look at <code>[t-1, t, t+1]</code>.</p>

      <div class="callout"><strong>Problem:</strong> during autoregressive generation, frame <code>t+1</code> belongs to the future. The model should never access future frames while generating the current one.</div>

      <p>CausalConv3D fixes this by restricting the kernal to see past and present only:</p>

      <samp class="nota">[t-2, t-1, t]</samp>

      <h2>Temporal Padding</h2>
      <p>At the beginning of the sequence (<code>t = 0</code>), there are no previous frames, so we pad the beginning of the video along the temporal dimension:</p>

      <samp class="nota">[pad, pad, t0, t1, t2, ...]</samp>

      <div class="callout"><strong>Key idea:</strong> Think of it like adding black frames at the start.</div>

      <h2>Implementation</h2>
      <span class="code-label">vae/conv.py</span>
      <pre><span class="c-kw">import</span> torch
<span class="c-kw">import</span> torch.nn <span class="c-kw">as</span> nn
<span class="c-kw">import</span> torch.nn.functional <span class="c-kw">as</span> F


<span class="c-kw">class</span> <span class="c-fn">CausalConv3d</span>(nn.Module):
    <span class="c-str">"""
    Conv3d that is causal in the time dimension.
    Spatial dims (H, W) use standard symmetric padding.
    Time dim uses left-only padding so the kernel never sees future frames.
    """</span>

    <span class="c-kw">def</span> <span class="c-fn">__init__</span>(
        self,
        in_channels: int,
        out_channels: int,
        kernel_size: int | tuple,
        stride: int | tuple = <span class="c-num">1</span>,
        dilation: int | tuple = <span class="c-num">1</span>,
        bias: bool = <span class="c-kw">True</span>,
    ):
        <span class="c-fn">super</span>().__init__()

        <span class="c-kw">if</span> isinstance(kernel_size, int):
            kernel_size = (kernel_size, kernel_size, kernel_size)
        <span class="c-kw">if</span> isinstance(stride, int):
            stride = (stride, stride, stride)
        <span class="c-kw">if</span> isinstance(dilation, int):
            dilation = (dilation, dilation, dilation)

        kt, kh, kw = kernel_size

<p>

  At this scale, every position is cheap to compare with every other position, which makes attention a very attractive choice.
</p>

<div class="callout">
  <strong>Note:</strong> If you think 4×4 is way too small and that all the spatial information is already lost, don't worry. When we reduce the H and W, we are also increasing the channels of the images, so the net spatial information remains conserved.
</div>

<p>
  This is why attention is usually inserted only at the bottleneck (lowest position).
  It is the cheapest place to use it.
  At full resolution, the number of spatial tokens would be huge, and the attention matrix would explode in cost.
</p>

<h2>A little mathematical proof</h2>

<p>
  Suppose the bottleneck feature map is <code>4×4</code>.
  That means we only have <code>16</code> spatial tokens per frame.
  The attention matrix is then only <code>16×16</code>, which is tiny.
</p>

<p>
  But if we tried to do the same thing at <code>64×64</code> resolution, we would have <code>4096</code> tokens per frame.
  The attention matrix would become <code>4096×4096</code>, which is far too expensive in memory and compute.
</p>



<h2>What about Temporal Attention?</h2>

<p>
  The VAE is not the part that takes care of temporal attention; the Diffusion Transformer does, and it will come at a later stage.
  The VAE's job is to compress and reconstruct the video efficiently while preserving enough information to decode it back later.
</p>

<p>
  Now, to focus only on the spatial side, we reshape the tensor from <code>(B, C, T, H, W)</code> to <code>(B×T, C, H×W)</code>.
  This turns the problem into <code>B×T</code> separate spatial attention problems. It's like treating each video in batch <code>B</code> and each frame <code>T</code> in every video as the new batch. I hope you were able to understand it.
</p>

<h2>Why Not use Temporal Attention here?</h2>

<p>
  Because temporal attention is much more expensive.
</p>

<p>
  Let:
</p>

<pre>frames = T
spatial tokens per frame = H×W</pre>

<p>
  Then:
</p>

<pre>Spatial-only attention per frame: (H×W)²
Total cost over all frames:       T(H×W)²</pre>

<p>
  But full spatiotemporal attention would operate on all video tokens at once:
</p>

<pre>Full video attention cost: (T×H×W)²</pre>

<p>
  That grows very quickly.
  The VAE does not need to solve the full motion problem anyway.
  That is the job of the Diffusion Transformer (DiT).
</p>

<h2>Wait, Isn't our CausalConv3D a temporal attention block?</h2>

<p>
  No, it's not. We generally have a kernel size of 3×3×3, so temporally it only sees local frames, not the complete video.
</p>

<p>
  But wait, you said we stack multiple of these layers, so shouldn't it be able to see far-away frames too?
</p>

<p>
  In that case, information flows like:
</p>

<p>
  1→3→5→7→⋯→20
</p>

<p>
  i.e., the "summary" of frames 1 to 19 attends to frame 20, so there is indirect attention.
  What an ideal attention block does is let frame 1 directly attend to frame 20.
</p>


<h2>How the Tensor Flows Through Attention</h2>

<pre>
Input x: (B=2, C=128, T=8, H=4, W=4)

1. Norm:
   GroupNorm over channels → same shape

2. Reshape for attention:
   permute (0,2,1,3,4) → (B, T, C, H, W) = (2, 8, 128, 4, 4)
   reshape  (B*T, C, H*W)               = (16, 128, 16)

   Now we have 16 separate feature maps,
   each with 16 spatial tokens of dim 128.

3. to_qkv Conv1d(128, 384, k=1):
   → (16, 384, 16)
   chunk into Q, K, V each (16, 128, 16)

4. Q·Kᵀ attention:
   Q permuted: (16, 16, 128)
   K:          (16, 128, 16)
   bmm →       (16, 16, 16)

   This is the spatial attention matrix.

5. attn·V:
   attn:       (16, 16, 16)
   V permuted: (16, 16, 128)
   bmm →       (16, 16, 128)

6. proj_out Conv1d:
   → (16, 128, 16)

7. Reshape back:
   (B, T, C, H, W) = (2, 8, 128, 4, 4)
   permute → (B, C, T, H, W) = (2, 128, 8, 4, 4)

8. Add residual:
   output = attention(x) + x
</pre>

<p>
  One small detail worth noticing: we use <code>Conv1d</code> with <code>kernel_size=1</code> for the Q, K, and V projections.
  This is mathematically the same as a linear layer applied independently at each token.
  We use convolution because the tensor is already arranged as <code>(BT, C, HW)</code>. The conv layer directly takes this format; if we were to use a linear layer, we would first have to rearrange the tensor before applying the linear layer.
</p>

<h2>Implementation</h2>

<span class="code-label">vae/attention.py</span>

<pre><span class="c-kw">class</span> <span class="c-fn">SpatialAttention</span>(nn.Module):

    Single-head self-attention over spatial tokens at each timestep.

    This gives the VAE global spatial context at the lowest resolution.

    For each frame independently:

<ul>

      <span class="ti-tag">${l.tag}</span>
    `;
    el.appendChild(row);
  });
}

function showHome() {
  history.replaceState(null, null, ' ');
  document.getElementById('home-view').classList.add('active');
  document.getElementById('lesson-view').classList.remove('active');
  document.getElementById('nav-progress').textContent = '';
  window.scrollTo(0, 0);
}

function showLesson(i, updateHash = true) {
  current = i;
  const l = lessons[i];

  if (updateHash) {
    updateURL(i);
    }
  document.getElementById('l-num').textContent = `${String(i+1).padStart(2,'0')} / ${lessons.length}`;
  document.getElementById('l-tag').textContent = l.tag;
  document.getElementById('l-title').textContent = l.title;
  document.getElementById('l-subtitle').textContent = l.subtitle;
  document.getElementById('l-body').innerHTML = l.body;
  document.getElementById('nav-progress').textContent = `${i+1} of ${lessons.length}`;

  const btnP = document.getElementById('btn-prev');
  const btnN = document.getElementById('btn-next');
  btnP.disabled = i === 0;
  btnN.disabled = i === lessons.length - 1;
  document.getElementById('prev-title').textContent = i > 0 ? lessons[i-1].title : '';
  document.getElementById('next-title').textContent = i < lessons.length - 1 ? lessons[i+1].title : '';

  document.getElementById('home-view').classList.remove('active');
  const lv = document.getElementById('lesson-view');
  lv.classList.add('active');

  const wrap = lv.querySelector('.lesson-wrap');
  wrap.classList.remove('fade-in');
  void wrap.offsetWidth;
  wrap.classList.add('fade-in');
  window.scrollTo(0, 0);
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < lessons.length) showLesson(next);
}

buildTopicList();
loadFromURL();
</script>
</body>
</html>
